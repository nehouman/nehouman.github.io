<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta name="description" content="ODS Rank Structure Live Test (100 MCQ). Navy and Marine Corps rank structures and Knowledge Book pages 1–8 for ODS Class 27015 at Officer Development School, OTC Newport, RI.">
<title>Yippee-Ki-Yay – ODS Rank Structure Live Test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2306101c' width='32' height='32' rx='6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c9a45c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23c9a45c'/%3E%3C/svg%3E">
<style>
:root {
  --navy-950: #06101c;
  --navy-900: #0a1628;
  --navy-800: #102033;
  --navy-700: #17304a;
  --navy-600: #1f3d5c;
  --gold: #c9a45c;
  --gold-bright: #e0c37a;
  --gold-dim: #8a6e32;
  --cream: #f4f0e6;
  --cream-soft: #f4f4f0;
  --text: #f3efe4;
  --muted: #b7c3d1;
  --line: rgba(201, 164, 92, 0.28);
  --line-subtle: rgba(255, 255, 255, 0.08);
  --success: #7dcea0;
  --success-bg: rgba(30, 107, 69, 0.35);
  --success-border: #3d9a68;
  --danger: #f0a0a0;
  --danger-bg: rgba(140, 40, 48, 0.38);
  --danger-border: #c45c5c;
  --warning: #f0d48a;
  --warning-bg: rgba(140, 100, 20, 0.3);
  --info: #9ec9ef;
  --info-bg: rgba(26, 74, 110, 0.4);
  --accent-bg: rgba(201, 164, 92, 0.16);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  --radius: 12px;
  --radius-sm: 8px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(201, 164, 92, 0.12), transparent 55%),
    radial-gradient(800px 500px at 100% 0%, rgba(31, 61, 92, 0.45), transparent 50%),
    var(--navy-950);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

body {
  padding: 16px 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: max(48px, env(safe-area-inset-bottom));
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
}

.masthead {
  text-align: center;
  padding: 18px 8px 8px;
}

.masthead-kicker {
  display: inline-block;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 8px;
}

.masthead h1 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(1.45rem, 4.4vw, 2.05rem);
  line-height: 1.2;
  margin: 0 0 10px;
  color: var(--cream);
}

.masthead .summary {
  color: var(--muted);
  font-size: 0.95rem;
  margin: 0 auto;
  max-width: 42em;
}

.tabs {
  display: flex;
  gap: 0;
  margin: 18px 0 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--navy-800);
}

.tabs button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 650;
  padding: 10px 12px;
  cursor: pointer;
  min-height: 44px;
}

.tabs button[aria-selected="true"] {
  background: var(--gold);
  color: var(--navy-950);
}

.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--navy-800);
  border: 1px solid var(--line-subtle);
  border-left: 4px solid var(--gold);
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}

.banner svg { flex: 0 0 auto; }

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-bright);
}

.banner p, .muted, .note {
  margin: 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.prose {
  margin: 0 0 14px;
  color: var(--text);
}

.section {
  margin: 16px 0;
}

.section h2 {
  font-family: var(--serif);
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 8px;
  color: var(--cream);
}

.section.question h2 {
  font-size: 1.2rem;
  line-height: 1.35;
}

.progress {
  margin: 4px 0 10px;
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.92rem;
}

.progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--navy-700);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
  width: 0;
}

.row-between {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.choice {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--navy-800);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  min-height: 48px;
}

.choice:disabled { cursor: default; }

.choice.selected { border-color: var(--gold); background: var(--accent-bg); }
.choice.correct { border-color: var(--success-border); background: var(--success-bg); }
.choice.wrong { border-color: var(--danger-border); background: var(--danger-bg); }

.choice-inner {
  display: flex;
  gap: 10px;
  align-items: center;
}

.letter {
  flex: 0 0 24px;
  height: 24px;
  border-radius: 999px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold-bright);
}

.choice-body { flex: 1; min-width: 0; }
.choice-body p { margin: 0; }
.flag { margin: 6px 0 0; font-size: 0.88rem; color: var(--muted); }

.device {
  display: flex;
  justify-content: center;
  padding: 10px;
  background: var(--cream-soft);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--radius-sm);
  max-width: 100%;
}

.device.compact { padding: 4px; }

.device-clip {
  overflow: hidden;
  background: #fff;
  border-radius: 6px;
  flex: 0 0 auto;
  max-width: 100%;
}

.device-clip img {
  display: block;
  max-width: none;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.prompt-image { margin: 0 0 12px; }

.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  appearance: none;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-bright);
  font: inherit;
  font-weight: 700;
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  min-height: 44px;
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.btn.primary {
  background: var(--gold);
  color: var(--navy-950);
  border-color: var(--gold);
}

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 4px;
}

.toggle-label { font-weight: 600; }

.switch {
  position: relative;
  width: 48px;
  height: 28px;
  flex: 0 0 48px;
  border-radius: 999px;
  background: var(--navy-600);
  border: 1px solid var(--line);
  cursor: pointer;
  appearance: none;
  padding: 0;
}

.switch[aria-checked="true"] { background: var(--gold); border-color: var(--gold); }

.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--cream);
  transition: left 0.15s ease;
  pointer-events: none;
}

.switch[aria-checked="true"] i { left: 22px; }

.callout {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--navy-800);
}

.callout .lead { font-weight: 700; margin: 0 0 4px; }
.callout p { margin: 0; }

.callout.success { background: var(--success-bg); border-color: var(--success-border); }
.callout.success .lead { color: var(--success); }
.callout.danger { background: var(--danger-bg); border-color: var(--danger-border); }
.callout.danger .lead { color: var(--danger); }
.callout.warning { background: var(--warning-bg); border-color: rgba(240, 212, 138, 0.45); }
.callout.warning .lead { color: var(--warning); }
.callout.info { background: var(--info-bg); border-color: rgba(158, 201, 239, 0.35); }
.callout.info .lead { color: var(--info); }

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin: 12px 0;
}

.metric {
  background: var(--navy-800);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 10px;
  text-align: center;
}

.metric .value {
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 650;
  line-height: 1.1;
}

.metric .label {
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.metric.success .value { color: var(--success); }
.metric.warning .value { color: var(--warning); }
.metric.danger .value { color: var(--danger); }

hr.div {
  border: 0;
  border-top: 1px solid var(--line-subtle);
  margin: 18px 0;
}

.missed-card {
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-sm);
  padding: 12px;
  background: var(--navy-800);
}

.missed-list { display: flex; flex-direction: column; gap: 12px; }
.missed-card .kicker { color: var(--muted); font-size: 0.88rem; margin: 0 0 4px; }
.missed-card .prompt { margin: 0 0 8px; font-weight: 650; }
.missed-card .ans { margin: 6px 0 0; color: var(--muted); }

.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}

.seg button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--navy-800);
  color: var(--muted);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 650;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
  min-height: 40px;
}

.seg button[aria-selected="true"] {
  background: var(--gold);
  color: var(--navy-950);
  border-color: var(--gold);
}

@media (max-width: 520px) {
  body { font-size: 15px; padding-top: 10px; }
  .choice { padding: 10px; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .switch i { transition: none; }
}

</style>

const TILE = 120;
const HQ_SHEETS = new Set([
  "navy_off_sleeve",
  "usmc_off",
  "navy_enl_sleeve",
  "navy_off_shoulder",
  "navy_off_collar",
  "navy_enl_collar",
  "usmc_enl",
  "comm",
]);

const QUESTION_BY_ID = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));

function hasSprite(key) {
  if (!key) return false;
  const cell = CELLS[key];
  return !!(cell && SHEETS[cell.sheet]);
}

function hasDevice(key) {
  return hasSprite(key);
}

function shuffle(items) {
  const next = items.slice();
  for (let i = next.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = next[i];
    next[i] = next[j];
    next[j] = tmp;
  }
  return next;
}

function formatTime(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function emptyAttempt() {
  return {
    mode: "all",
    order: [],
    optionOrder: {},
    index: 0,
    answers: {},
    revealed: false,
    timerOn: false,
    startedAt: 0,
    finishedAt: 0,
  };
}

function buildAttempt(mode, missedIds, timerOn) {
  const pool =
    mode === "missed" && missedIds.length > 0
      ? QUESTIONS.filter((q) => missedIds.includes(q.id))
      : QUESTIONS;
  const order = shuffle(pool.map((q) => q.id));
  const optionOrder = {};
  for (const id of order) {
    optionOrder[id] = shuffle([0, 1, 2, 3]);
  }
  return {
    mode,
    order,
    optionOrder,
    index: 0,
    answers: {},
    revealed: false,
    timerOn,
    startedAt: Date.now(),
    finishedAt: 0,
  };
}

function missedIdsFrom(attempt) {
  return attempt.order.filter((id) => {
    const chosen = attempt.answers[id];
    const perm = attempt.optionOrder[id] || [0, 1, 2, 3];
    return chosen === undefined || perm[chosen] !== 0;
  });
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "dataset") Object.assign(node.dataset, v);
      else if (v === true) node.setAttribute(k, "");
      else node.setAttribute(k, String(v));
    }
  }
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function text(s) {
  const p = document.createElement("p");
  p.className = "prose";
  p.textContent = s;
  return p;
}

function muted(s) {
  const p = document.createElement("p");
  p.className = "muted";
  p.textContent = s;
  return p;
}

function deviceMaxWidth() {
  const wrap = document.querySelector(".wrap");
  const avail = (wrap ? wrap.clientWidth : window.innerWidth) - 56;
  return Math.max(140, Math.min(420, avail));
}

function renderDeviceImage(imageKey, alt, size) {
  if (size === undefined) size = 220;
  const cell = CELLS[imageKey];
  const sheet = cell ? SHEETS[cell.sheet] : "";
  if (!(cell && sheet)) return null;

  const col = cell.i % cell.cols;
  const row = Math.floor(cell.i / cell.cols);
  const isHq = HQ_SHEETS.has(cell.sheet);
  const cw = isHq ? (cell.cw ?? 220) : TILE;
  const ch = isHq ? (cell.ch ?? 220) : TILE;
  const aspect = cw / ch;
  const cap = deviceMaxWidth();
  let dispW;
  let dispH;
  if (aspect > 2) {
    dispH = Math.max(96, Math.round(size * 0.5));
    dispW = Math.round(dispH * aspect);
    const maxW = Math.min(420, cap);
    if (dispW > maxW) {
      dispW = maxW;
      dispH = Math.max(72, Math.round(dispW / aspect));
    }
  } else if (cw >= ch) {
    dispW = Math.min(size, cap);
    dispH = Math.max(1, Math.round((dispW * ch) / cw));
  } else {
    dispH = size;
    dispW = Math.max(1, Math.round((size * cw) / ch));
    if (dispW > cap) {
      dispW = cap;
      dispH = Math.max(1, Math.round((dispW * ch) / cw));
    }
  }
  const tw = isHq ? (cell.tw ?? 220) : TILE;
  const th = isHq ? (cell.th ?? 220) : TILE;
  const ox = (tw - cw) / 2;
  const oy = (th - ch) / 2;
  const scale = dispW / cw;

  const wrap = el("div", { class: "device" + (size < 160 ? " compact" : "") });
  const clip = el("div", { class: "device-clip" });
  clip.style.width = dispW + "px";
  clip.style.height = dispH + "px";
  const img = el("img", { alt: alt, src: sheet, draggable: "false" });
  img.width = cell.cols * tw * scale;
  img.style.width = cell.cols * tw * scale + "px";
  img.style.height = "auto";
  img.style.marginLeft = -(col * tw + ox) * scale + "px";
  img.style.marginTop = -(row * th + oy) * scale + "px";
  img.style.maxWidth = "none";
  img.style.display = "block";
  clip.append(img);
  wrap.append(clip);
  return wrap;
}

function classBanner() {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", "22");
  svg.setAttribute("height", "22");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("aria-hidden", "true");
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("cx", "12");
  circle.setAttribute("cy", "5");
  circle.setAttribute("r", "2.2");
  circle.setAttribute("stroke", "#c9a45c");
  circle.setAttribute("stroke-width", "1.8");
  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", "M12 7.2 V20 M12 11.5 H8.5 M7 20 C7 16.5 9 14.5 12 14.5 C15 14.5 17 16.5 17 20");
  path.setAttribute("stroke", "#c9a45c");
  path.setAttribute("stroke-width", "1.8");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.append(circle, path);

  const body = el("div", null,
    el("div", { class: "badge" }, "ODS Class 27015"),
    muted("Officer Development School • Class 27015 • OTC Newport, RI")
  );
  return el("div", { class: "banner" }, svg, body);
}

function progressBar(current, total) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  const fill = el("div", { class: "progress-fill" });
  fill.style.width = pct + "%";
  return el("div", { class: "progress" },
    el("div", { class: "progress-meta" },
      el("span", null, current + " / " + total),
      el("span", null, pct + "%")
    ),
    el("div", { class: "progress-track" }, fill)
  );
}

function optionRow(index, choice, selected, revealed, isCorrect, onSelect) {
  const letter = String.fromCharCode(65 + index);
  let cls = "choice";
  if (revealed && isCorrect) cls += " correct";
  else if (revealed && selected && !isCorrect) cls += " wrong";
  else if (selected) cls += " selected";

  const body = el("div", { class: "choice-body" });
  if (choice.image) {
    if (hasDevice(choice.image)) {
      const hold = el("div", { style: { display: "flex", justifyContent: "center", padding: "4px" } });
      hold.append(renderDeviceImage(choice.image, "Option " + letter, 200));
      body.append(hold);
    } else {
      body.append(text("Image option " + letter));
    }
  } else {
    body.append(text(choice.label));
  }
  if (revealed && isCorrect) {
    const f = el("p", { class: "flag" }, "Correct answer");
    body.append(f);
  }
  if (revealed && selected && !isCorrect) {
    body.append(el("p", { class: "flag" }, "Your answer"));
  }

  const btn = el("button", { class: cls, type: "button" },
    el("div", { class: "choice-inner" },
      el("div", { class: "letter" }, letter),
      body
    )
  );
  if (revealed) btn.disabled = true;
  else btn.addEventListener("click", onSelect);
  return btn;
}

function startScreen() {
  const box = el("div");
  box.append(classBanner());
  box.append(text("100 exam-style questions from the ODS Officer Knowledge Book. Sixty-five cover rank structure and insignia, including questions with four image choices; thirty-five come from pages 1–8 (mission, discipline, core values, CNO attributes and principles, leader-development lanes, Code of Conduct, Navy and Marine Corps birthdays, leadership traits, chain of command, the Oath of Office, and the Sailor's Creed). Question and answer order are shuffled each attempt."));

  const section = el("div", { class: "section" },
    el("h2", null, "What to expect"),
    text("One question at a time, four choices, and a progress count. After you answer, the correct choice is shown immediately. At the end you will get a score, a review of anything missed, and a chance to retake the missed items or the full 100, shuffled again.")
  );
  box.append(section);

  const toggle = el("div", { class: "toggle" },
    el("div", { class: "toggle-label" }, "Show optional timer")
  );
  const sw = el("button", {
    class: "switch",
    type: "button",
    role: "switch",
    "aria-checked": state.timerOn ? "true" : "false",
    "aria-label": "Show optional timer",
  }, el("i"));
  sw.addEventListener("click", () => {
    state.timerOn = !state.timerOn;
    render();
  });
  toggle.append(sw);
  box.append(toggle);

  const startBtn = el("button", { class: "btn primary", type: "button" }, "Start live test");
  startBtn.addEventListener("click", () => start("all"));
  box.append(el("div", { class: "actions" }, startBtn));
  box.append(text("Answers follow the Knowledge Book wording, including abbreviations such as 2ndLt, RDML, and W1. No official Navy seals or logos are used here."));
  return box;
}

function testScreen() {
  const attempt = state.attempt;
  const total = attempt.order.length;
  const id = attempt.order[attempt.index];
  const question = QUESTION_BY_ID[id];
  const perm = attempt.optionOrder[id] || [0, 1, 2, 3];
  const selected = attempt.answers[id];
  const elapsed = attempt.timerOn ? (attempt.finishedAt || state.now) - attempt.startedAt : 0;
  const imageChoices = question.choices.some((c) => !!c.image);
  const isCorrect = attempt.revealed && perm[selected ?? -1] === 0;

  const box = el("div");
  box.append(classBanner());
  box.append(progressBar(attempt.index + 1, total));

  const meta = el("div", { class: "row-between" },
    el("span", null,
      (attempt.mode === "missed" ? "Retake missed only" : "Full 100-question test") +
      " · " +
      (question.kind === "picture" ? "Picture question" : "Text question")
    )
  );
  if (attempt.timerOn) meta.append(el("span", { id: "timer-readout" }, formatTime(elapsed)));
  box.append(meta);

  const section = el("div", { class: "section question" });
  section.append(el("h2", null, question.prompt));
  if (question.image && hasDevice(question.image)) {
    const hold = el("div", { class: "prompt-image" });
    hold.append(renderDeviceImage(question.image, "Rank insignia from the ODS Knowledge Book"));
    section.append(hold);
  }
  const choices = el("div", { class: "choices" });
  perm.forEach((sourceIndex, visibleIndex) => {
    choices.append(optionRow(
      visibleIndex,
      question.choices[sourceIndex],
      selected === visibleIndex,
      attempt.revealed,
      sourceIndex === 0,
      () => onSelect(visibleIndex)
    ));
  });
  section.append(choices);

  if (attempt.revealed) {
    const tone = isCorrect ? "success" : "danger";
    const lead = isCorrect ? "Correct" : "Incorrect";
    const body = isCorrect
      ? "That matches the Knowledge Book."
      : "The correct answer is " + (question.choices[0].label || "the highlighted image") + ".";
    section.append(el("div", { class: "callout " + tone },
      el("div", { class: "lead" }, lead),
      el("p", null, body)
    ));
    const next = el("button", { class: "btn primary", type: "button" },
      attempt.index + 1 >= total ? "See score" : "Next question"
    );
    next.addEventListener("click", onNext);
    section.append(el("div", { class: "actions" }, next));
  } else {
    section.append(muted(imageChoices ? "Tap an image to lock in your answer." : "Tap an answer to lock it in."));
  }
  box.append(section);
  return box;
}

function resultsScreen() {
  const attempt = state.attempt;
  const total = attempt.order.length;
  const missed = missedIdsFrom(attempt);
  const correct = total - missed.length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const elapsed = attempt.timerOn ? attempt.finishedAt - attempt.startedAt : 0;
  const tone = pct >= 90 ? "success" : pct >= 70 ? "warning" : "danger";
  const calloutTone = pct >= 90 ? "success" : pct >= 70 ? "info" : "warning";
  const lead = pct >= 90
    ? "Welcome to the party, pal!"
    : pct >= 70
      ? "Solid, with a few holes to close"
      : "Worth another pass on the missed items";

  const box = el("div");
  box.append(classBanner());
  box.append(muted(
    "ODS Class 27015 · " +
    (attempt.mode === "missed" ? "Missed-only retake" : "100-question live test")
  ));

  const metrics = el("div", { class: "metrics" });
  function metric(value, label, t) {
    return el("div", { class: "metric" + (t ? " " + t : "") },
      el("div", { class: "value" }, value),
      el("div", { class: "label" }, label)
    );
  }
  metrics.append(
    metric(correct + "/" + total, "Score", tone),
    metric(pct + "%", "Percent", tone),
    metric(String(missed.length), "Missed")
  );
  if (attempt.timerOn) metrics.append(metric(formatTime(elapsed), "Time"));
  box.append(metrics);

  box.append(el("div", { class: "callout " + calloutTone },
    el("div", { class: "lead" }, lead),
    el("p", null, "Review the missed questions below, or open the reference tables. You can retake only what you missed, or start a fresh shuffled 100.")
  ));

  const retakeAll = el("button", { class: "btn primary", type: "button" }, "Retake all, shuffled");
  retakeAll.addEventListener("click", () => start("all"));
  const retakeMissed = el("button", { class: "btn", type: "button" }, "Retake missed only");
  if (missed.length === 0) retakeMissed.disabled = true;
  else retakeMissed.addEventListener("click", () => start("missed"));
  const openRef = el("button", { class: "btn", type: "button" }, "Open reference");
  openRef.addEventListener("click", () => { state.tab = "reference"; render(); });
  box.append(el("div", { class: "actions" }, retakeAll, retakeMissed, openRef));
  box.append(el("hr", { class: "div" }));

  const section = el("div", { class: "section" }, el("h2", null, "Missed questions"));
  if (missed.length === 0) {
    section.append(text("Nothing missed on this attempt."));
  } else {
    const list = el("div", { class: "missed-list" });
    missed.forEach((mid, i) => {
      const q = QUESTION_BY_ID[mid];
      const perm = attempt.optionOrder[mid] || [0, 1, 2, 3];
      const chosenIndex = attempt.answers[mid];
      const chosen =
        chosenIndex === undefined
          ? "No answer"
          : q.choices[perm[chosenIndex]]?.label || ("Option " + String.fromCharCode(65 + chosenIndex));
      const correctLabel = q.choices[0].label || "The correct image, highlighted in a retake.";
      const card = el("div", { class: "missed-card" },
        el("p", { class: "kicker" }, "Missed " + (i + 1) + " of " + missed.length),
        el("p", { class: "prompt" }, q.prompt)
      );
      if (q.image && hasDevice(q.image)) {
        card.append(renderDeviceImage(q.image, "Rank insignia from the ODS Knowledge Book"));
      }
      if (q.choices[0].image && hasDevice(q.choices[0].image)) {
        card.append(renderDeviceImage(q.choices[0].image, "Correct insignia"));
      }
      card.append(el("p", { class: "ans" }, "Your answer: " + (chosen || "the image you selected")));
      card.append(el("p", { class: "ans" }, "Correct: " + correctLabel));
      list.append(card);
    });
    section.append(list);
  }
  box.append(section);
  return box;
}

function referenceScreen() {
  const filters = [
    { value: "navy-off", label: "Navy officer" },
    { value: "usmc-off", label: "Marine officer" },
    { value: "navy-enl", label: "Navy enlisted" },
    { value: "usmc-enl", label: "Marine enlisted" },
    { value: "community", label: "Community devices" },
  ];
  const seg = el("div", { class: "seg", role: "tablist", "aria-label": "Reference filters" });
  filters.forEach((f) => {
    const b = el("button", {
      type: "button",
      "aria-selected": state.refFilter === f.value ? "true" : "false",
    }, f.label);
    b.addEventListener("click", () => { state.refFilter = f.value; render(); });
    seg.append(b);
  });
  return el("div", { class: "section" },
    el("h2", null, "Rank reference"),
    text("Tables follow the ODS Officer Knowledge Book. Full rank tables will appear here, filterable by community."),
    seg,
    text("Open a filter, then use the live test to drill the ranks.")
  );
}

const state = {
  tab: "test",
  phase: "start",
  timerOn: false,
  attempt: emptyAttempt(),
  lastMissed: [],
  refFilter: "navy-off",
  now: Date.now(),
};

let timerId = null;

function syncTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
  if (state.phase === "test" && state.attempt.timerOn && !state.attempt.finishedAt) {
    timerId = setInterval(() => {
      state.now = Date.now();
      const readout = document.getElementById("timer-readout");
      if (readout) {
        const elapsed = (state.attempt.finishedAt || state.now) - state.attempt.startedAt;
        readout.textContent = formatTime(elapsed);
      }
    }, 1000);
  }
}

function start(mode) {
  state.attempt = buildAttempt(mode, state.lastMissed, state.timerOn);
  state.phase = "test";
  state.tab = "test";
  state.now = Date.now();
  render();
}

function onSelect(choiceIndex) {
  if (state.attempt.revealed) return;
  const id = state.attempt.order[state.attempt.index];
  state.attempt = {
    ...state.attempt,
    answers: { ...state.attempt.answers, [id]: choiceIndex },
    revealed: true,
  };
  render();
}

function onNext() {
  const attempt = state.attempt;
  if (attempt.index + 1 >= attempt.order.length) {
    const finished = { ...attempt, finishedAt: Date.now(), revealed: true };
    state.attempt = finished;
    state.lastMissed = missedIdsFrom(finished);
    state.phase = "results";
    render();
    return;
  }
  state.attempt = {
    ...attempt,
    index: attempt.index + 1,
    revealed: false,
  };
  render();
}

function render() {
  const root = document.getElementById("app");
  const wrap = el("div", { class: "wrap" });

  const head = el("header", { class: "masthead" },
    el("div", { class: "masthead-kicker" }, "ODS Class 27015 • OTC Newport, RI"),
    el("h1", null, "Yippee-Ki-Yay – ODS Rank Structure Live Test"),
    el("p", { class: "summary" }, "ODS Rank Structure Live Test (100 MCQ). Navy and Marine Corps rank structures and Knowledge Book pages 1–8 for ODS Class 27015 at Officer Development School, OTC Newport, RI. Answers follow the Knowledge Book.")
  );
  wrap.append(head);

  const tabs = el("div", { class: "tabs", role: "tablist", "aria-label": "Test sections" });
  function tabBtn(value, label) {
    const b = el("button", {
      type: "button",
      role: "tab",
      "aria-selected": state.tab === value ? "true" : "false",
    }, label);
    b.addEventListener("click", () => { state.tab = value; render(); });
    return b;
  }
  tabs.append(tabBtn("test", "Live test"), tabBtn("reference", "Reference tables"));
  wrap.append(tabs);

  let body;
  if (state.tab === "reference") body = referenceScreen();
  else if (state.phase === "start") body = startScreen();
  else if (state.phase === "test" && state.attempt.order.length > 0) body = testScreen();
  else body = resultsScreen();
  wrap.append(body);

  root.replaceChildren(wrap);
  syncTimer();
}

render();


</script>
</body>
